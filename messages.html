<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Messages · Nimbus Admin</title>
  <meta name="description" content="Messages — Nimbus ERP &amp; CRM admin template.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/plugins/plus-jakarta-sans/index.css">
  <link rel="stylesheet" href="assets/plugins/phosphor-icons/regular/style.css">
  <link rel="stylesheet" href="assets/plugins/phosphor-icons/fill/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js"></script>
  <script src="assets/js/data.js"></script>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="Sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="main">

      <div class="page-header">
        <div>
          <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><span>Workspace</span><span aria-current="page">Messages</span></nav>
          <h1 class="page-title">Messages</h1>
          <p class="page-subtitle">Chat with your team and customers.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-primary" type="button" data-modal="#new-chat"><i class="ph ph-note-pencil"></i>New message</button>
        </div>
      </div>

      <section class="card split" id="chat" aria-label="Conversations">
        <div class="split-side">
          <div class="split-search stack-sm">
            <div class="input-icon"><i class="ph ph-magnifying-glass"></i><input class="input" type="search" id="q" placeholder="Search conversations…" aria-label="Search conversations"></div>
            <div class="segmented" data-segmented id="filter" aria-label="Filter conversations">
              <button type="button" aria-pressed="true" data-value="all">All</button>
              <button type="button" aria-pressed="false" data-value="unread">Unread</button>
              <button type="button" aria-pressed="false" data-value="online">Online</button>
            </div>
          </div>
          <ul class="split-list" id="convos"></ul>
        </div>
        <div class="split-main">
          <div class="thread-head">
            <button class="btn btn-ghost btn-icon back-btn" type="button" id="back" aria-label="Back to conversations"><i class="ph ph-arrow-left"></i></button>
            <span id="thread-avatar"></span>
            <div class="grow" style="min-width:0"><strong id="thread-name"></strong><small id="thread-status"></small></div>
            <button class="btn btn-ghost btn-icon hide-sm" type="button" aria-label="Start voice call" onclick="App.toast('Calling…', { type: 'info' })"><i class="ph ph-phone"></i></button>
            <button class="btn btn-ghost btn-icon hide-sm" type="button" aria-label="Start video call" onclick="App.toast('Starting video call…', { type: 'info' })"><i class="ph ph-video-camera"></i></button>
            <div class="dropdown">
              <button class="btn btn-ghost btn-icon" type="button" data-dropdown aria-haspopup="true" aria-expanded="false" aria-label="Conversation options"><i class="ph ph-dots-three-vertical"></i></button>
              <div class="dropdown-menu">
                <button class="dropdown-item" type="button" id="mute"><i class="ph ph-bell-slash"></i>Mute notifications</button>
                <button class="dropdown-item" type="button" id="mark-unread"><i class="ph ph-envelope-simple"></i>Mark as unread</button>
                <div class="dropdown-divider"></div>
                <button class="dropdown-item danger" type="button" id="clear"><i class="ph ph-trash"></i>Clear history</button>
              </div>
            </div>
          </div>
          <div class="thread-body" id="thread" role="log" aria-live="polite" aria-label="Messages"></div>
          <form class="composer" id="composer" autocomplete="off">
            <button class="btn btn-ghost btn-icon" type="button" id="attach-btn" aria-label="Attach a file"><i class="ph ph-paperclip"></i></button><input type="file" id="attach" hidden>
            <label class="sr-only" for="message">Message</label>
            <input class="input" id="message" placeholder="Write a message…" maxlength="1000">
            <button class="btn btn-primary btn-icon" type="submit" aria-label="Send message"><i class="ph ph-paper-plane-right"></i></button>
          </form>
        </div>
      </section>

      <dialog class="modal" id="new-chat" aria-labelledby="new-chat-title">
        <form class="modal-form" data-validate novalidate id="new-chat-form">
          <div class="modal-header">
            <div><h2 class="modal-title" id="new-chat-title">New message</h2><p class="modal-desc">Start a conversation with a teammate.</p></div>
            <button class="btn btn-ghost btn-icon" type="button" data-modal-close aria-label="Close"><i class="ph ph-x"></i></button>
          </div>
          <div class="modal-body stack-sm">
            <div class="field"><label class="label" for="nc-to">To</label><select class="select" id="nc-to" name="to" required></select></div>
            <div class="field"><label class="label" for="nc-text">Message</label><textarea class="textarea" id="nc-text" name="text" required placeholder="Say hello…"></textarea></div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-modal-close>Cancel</button>
            <button class="btn btn-primary" type="submit"><i class="ph ph-paper-plane-right"></i>Send</button>
          </div>
        </form>
      </dialog>

    </main>
  </div>
</div>

<script>
  const { fmt, esc, avatar, toast, $ } = App;
  const convos = DB.conversations;
  let current = convos[0], filter = 'all';
  const REPLIES = ['Sounds good, thanks!', 'Got it — I’ll take care of it today.', 'Perfect, let’s sync tomorrow morning.', 'Thanks for the update!', 'On it. I’ll share an update in an hour.'];
  const dayLabel = d => { const x = new Date(d), t = new Date(); t.setHours(0, 0, 0, 0); const diff = Math.round((t - new Date(x.getFullYear(), x.getMonth(), x.getDate())) / 864e5); return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : fmt.date(d); };
  const last = c => c.messages[c.messages.length - 1];
  const avatarWithPresence = (c, cls = '') => `<span style="position:relative;display:inline-flex">${avatar(c.name, cls)}<span class="presence ${c.online ? 'online' : ''}" title="${c.online ? 'Online' : 'Offline'}"></span></span>`;

  function renderConvos() {
    const q = $('#q').value.trim().toLowerCase();
    const items = convos.filter(c => (!q || c.name.toLowerCase().includes(q)) && (filter === 'all' || (filter === 'unread' ? c.unread : c.online)))
      .sort((a, b) => new Date(last(b)?.time || 0) - new Date(last(a)?.time || 0));
    $('#convos').innerHTML = items.map(c => {
      const m = last(c);
      return `<li><button class="convo${c === current ? ' is-active' : ''}${c.unread ? ' is-unread' : ''}" type="button" data-id="${c.id}" aria-current="${c === current}">
        ${avatarWithPresence(c)}<span class="convo-body"><span class="convo-top"><strong>${esc(c.name)}</strong><time>${m ? fmt.ago(m.time) : ''}</time></span>
        <span class="convo-snippet"><span>${m ? (m.from === 'me' ? 'You: ' : '') + esc(m.text) : 'No messages yet'}</span>${c.unread ? `<span class="count-pill" aria-label="${c.unread} unread">${c.unread}</span>` : ''}</span></span></button></li>`;
    }).join('') || '<li class="empty"><span class="icon-tile tone-neutral"><i class="ph ph-chats-circle"></i></span><h3>No conversations</h3></li>';
  }
  function renderThread(typing = false) {
    const c = current;
    $('#thread-avatar').innerHTML = avatarWithPresence(c);
    $('#thread-name').textContent = c.name;
    $('#thread-status').textContent = `${c.role} · ${c.online ? 'Online' : 'Last seen ' + fmt.ago(last(c)?.time || new Date())}`;
    let prevDay = '';
    $('#thread').innerHTML = c.messages.map(m => {
      const day = dayLabel(m.time), sep = day !== prevDay ? `<div class="day-sep">${day}</div>` : '';
      prevDay = day;
      const body = m.file ? `<span class="flex items-center gap-2"><i class="ph ph-paperclip"></i>${esc(m.file)}</span>` : esc(m.text);
      return `${sep}<div class="msg ${m.from === 'me' ? 'out' : 'in'}">${m.from === 'me' ? '' : avatar(c.name, 'avatar-sm')}<div><div class="msg-bubble">${body}</div><time datetime="${m.time}">${fmt.time(m.time)}</time></div></div>`;
    }).join('') + (typing ? `<div class="msg in">${avatar(c.name, 'avatar-sm')}<div class="msg-bubble typing" aria-label="${esc(c.name)} is typing"><span></span><span></span><span></span></div></div>` : '');
    $('#thread').scrollTop = $('#thread').scrollHeight;
  }
  function open(c) {
    current = c; c.unread = 0;
    renderConvos(); renderThread();
    $('#chat').classList.add('show-main');
    if (matchMedia('(min-width: 900px)').matches) $('#message').focus();
  }
  function send(msg) {
    current.messages.push({ from: 'me', time: new Date().toISOString(), ...msg });
    renderThread(); renderConvos();
    const c = current;
    setTimeout(() => { if (c === current) renderThread(true); }, 700);
    setTimeout(() => {
      c.messages.push({ from: 'them', text: REPLIES[c.messages.length % REPLIES.length], time: new Date().toISOString() });
      if (c === current) renderThread(); else c.unread++;
      renderConvos();
    }, 2200);
  }

  $('#convos').addEventListener('click', e => { const b = e.target.closest('[data-id]'); if (b) open(convos.find(c => c.id === b.dataset.id)); });
  $('#q').addEventListener('input', renderConvos);
  $('#filter').addEventListener('segment', e => { filter = e.detail; renderConvos(); });
  $('#back').addEventListener('click', () => { $('#chat').classList.remove('show-main'); $(`#convos [data-id="${current.id}"]`)?.focus(); });
  $('#composer').addEventListener('submit', e => { e.preventDefault(); const t = $('#message').value.trim(); if (!t) return; $('#message').value = ''; send({ text: t }); });
  $('#attach-btn').addEventListener('click', () => $('#attach').click());
  $('#attach').addEventListener('change', e => { const file = e.target.files[0]; if (file) send({ text: file.name, file: file.name }); e.target.value = ''; });
  $('#mute').addEventListener('click', () => toast(`Notifications muted for ${current.name}`, { type: 'info' }));
  $('#mark-unread').addEventListener('click', () => { current.unread = 1; renderConvos(); toast('Marked as unread', { type: 'info' }); });
  $('#clear').addEventListener('click', () => { current.messages = []; renderThread(); renderConvos(); toast('Conversation cleared'); });

  $('#nc-to').innerHTML = DB.employees.map(e => `<option>${esc(e.name)}</option>`).join('');
  $('#new-chat-form').addEventListener('valid', e => {
    let c = convos.find(x => x.name === e.detail.to);
    if (!c) { const emp = DB.employees.find(x => x.name === e.detail.to); c = { id: `CV-${convos.length + 1}`, name: emp.name, role: emp.role, online: emp.status !== 'On leave', unread: 0, messages: [] }; convos.unshift(c); }
    open(c); send({ text: e.detail.text });
  });

  renderConvos(); renderThread();
</script>
</body>
</html>
