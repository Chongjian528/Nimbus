<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Server Error · Nimbus Admin</title>
  <meta name="description" content="Something went wrong on our side.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/plugins/plus-jakarta-sans/index.css">
  <link rel="stylesheet" href="assets/plugins/phosphor-icons/regular/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js"></script>
</head>
<body>
<main class="error-page" id="main">
  <button class="btn btn-ghost btn-icon" type="button" data-action="toggle-theme" aria-label="Switch theme" style="position:fixed;top:16px;right:16px"><i class="ph ph-moon"></i></button>
  <div>
    <svg viewBox="0 0 220 120" width="220" height="120" aria-hidden="true" style="margin:0 auto 8px">
      <ellipse cx="110" cy="108" rx="70" ry="8" style="fill:var(--surface-3)"/>
      <path d="M62 92h96a26 26 0 0 0 3-51.8A38 38 0 0 0 88 34a28 28 0 0 0-26 58z" style="fill:var(--warning-soft)"/>
      <path d="M92 60l8 8m0-8l-8 8M122 60l8 8m0-8l-8 8" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--warning-ink)"/>
      <path d="M100 84q13 6 26 0" fill="none" stroke-width="4" stroke-linecap="round" style="stroke:var(--warning-ink)"/>
      <path d="M150 100l10-18 6 10 8-14" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" style="stroke:var(--chart-4)"/>
    </svg>
    <p class="code">500</p>
    <h1>Something went wrong on our side</h1>
    <p>Our team has been notified and is already on it. Please try again in a moment.</p>
    <div class="flex wrap gap-2 justify-center">
      <button class="btn btn-primary" type="button" onclick="location.reload()"><i class="ph ph-arrows-clockwise"></i>Try again</button>
      <a class="btn btn-secondary" href="index.html"><i class="ph ph-house"></i>Back to dashboard</a>
    </div>
    <p class="text-sm text-3 mt-6" style="margin-bottom:0">Error reference: <code>NB-500-7F3A</code> · <a href="help.html">Contact support</a></p>
  </div>
</main>
</body>
</html>
