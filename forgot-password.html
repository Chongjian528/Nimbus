<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Password · Nimbus Admin</title>
  <meta name="description" content="Reset your Nimbus password.">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/plugins/plus-jakarta-sans/index.css">
  <link rel="stylesheet" href="assets/plugins/phosphor-icons/regular/style.css">
  <link rel="stylesheet" href="assets/css/app.css">
  <script src="assets/js/app.js"></script>
</head>
<body>
<main class="error-page" id="main" style="background:var(--grad-soft)">
  <button class="btn btn-ghost btn-icon" type="button" data-action="toggle-theme" aria-label="Switch theme" style="position:fixed;top:16px;right:16px"><i class="ph ph-moon"></i></button>
  <div class="card" style="width:min(440px,100%);padding:32px;text-align:left">
    <div id="request">
      <span class="icon-tile lg tone-primary mb-4"><i class="ph ph-key"></i></span>
      <h1 style="font-size:1.5rem">Forgot your password?</h1>
      <p class="text-2 mt-2 mb-6">Enter the email you use for Nimbus and we’ll send you a reset link.</p>
      <form class="stack-sm" id="reset-form" data-validate novalidate data-keep>
        <div class="field"><label class="label" for="email">Email</label><div class="input-icon"><i class="ph ph-envelope-simple"></i><input class="input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@company.com"></div></div>
        <button class="btn btn-primary btn-lg btn-block" type="submit">Send reset link</button>
      </form>
    </div>
    <div id="sent" hidden>
      <span class="icon-tile lg tone-success mb-4"><i class="ph ph-envelope-open"></i></span>
      <h1 style="font-size:1.5rem">Check your inbox</h1>
      <p class="text-2 mt-2 mb-6">We sent a reset link to <strong id="sent-to"></strong>. It expires in 30 minutes.</p>
      <button class="btn btn-secondary btn-block" type="button" id="resend"><i class="ph ph-arrows-clockwise"></i>Resend email</button>
    </div>
    <p class="text-sm text-center mt-6"><a class="fw-600" href="login.html"><i class="ph ph-arrow-left"></i> Back to sign in</a></p>
  </div>
</main>
<script>
  document.getElementById('reset-form').addEventListener('valid', e => {
    document.getElementById('sent-to').textContent = e.detail.email;
    document.getElementById('request').hidden = true;
    document.getElementById('sent').hidden = false;
    document.getElementById('resend').focus();
  });
  document.getElementById('resend').addEventListener('click', () => App.toast('A new link is on its way', { type: 'info' }));
</script>
</body>
</html>
